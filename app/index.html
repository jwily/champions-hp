<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Champions HP">
  <meta name="theme-color" content="#000000">
  <title>Champions HP</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <!-- Launch screens: plain black while iOS starts the app (tests/tools/make-icons.js). -->
  <link rel="apple-touch-startup-image" href="icons/launch-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="icons/launch-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="preload" href="fonts/dela-gothic-one.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/zen-antique.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Black from the first frame; the page fades in once the fonts are ready (app.js). -->
  <style>
    html, body { background: #000; }
    body { transition: opacity 0.12s ease-out; }
    body.starting { opacity: 0; animation: show-anyway 0s 2.5s forwards; }
    @keyframes show-anyway { to { opacity: 1; } }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body class="starting">
  <main id="page">
    <!-- Running head, after the manga's "NARUTO—ナルト—1": the number counts games. -->
    <header class="head">
      <span class="running"><b>HP</b>—ヒットポイント—<b id="game-num">1</b></span>
      <span id="notice" class="narration notice" role="status" hidden></span>
      <button id="set" class="narration">New game</button>
    </header>

    <section id="villain" class="panel" aria-label="Villain">
      <div class="art-wrap"><div class="tone fade"></div><div class="focus"></div></div>
      <div class="balloon shout" aria-hidden="true">
        <!-- Balloons are vector outlines with a non-scaling stroke, so the ink line is one width all
             round, even stretched to the balloon's shape. -->
        <svg viewBox="0 0 100 100" preserveAspectRatio="none"><polygon vector-effect="non-scaling-stroke" points="50,0 58,13 74,4 72,21 94,17 82,34 100,46 82,56 96,74 74,70 76,92 60,80 50,100 40,82 24,96 26,72 4,78 18,58 0,46 18,34 6,16 28,22 26,4 42,16"/></svg>
        <span class="line"></span>
      </div>
      <div class="reading" aria-hidden="true"><div class="num"></div><div class="max"></div></div>
      <span class="status visually-hidden" aria-live="polite"></span>
      <!-- Inset panel in the corner, after the chapter titles ("ナンバー1：うずまきナルト!!"). -->
      <div class="inset"><ruby>◎<rt>ステージ</rt></ruby><span id="stage-num">1</span>：VILLAIN!!</div>
      <button id="next" class="narration next">Next stage ▸</button>
      <div class="border"></div>
    </section>
    <div class="keys">
      <button class="panel key" data-side="villain" data-dir="-1" aria-label="Villain minus 1, hold for minus 5">−<span class="border"></span></button>
      <button class="panel key" data-side="villain" data-dir="1" aria-label="Villain plus 1, hold for plus 5">+<span class="border"></span></button>
    </div>

    <div class="seal-row">
      <!-- The max-HP toggle, as a hanko seal: 増 ("increase"), one character in a double-ruled frame. -->
      <button id="seal" class="seal" aria-pressed="false" aria-label="Raise or lower max HP">増</button>
    </div>

    <section id="hero" class="panel" aria-label="Hero">
      <div class="art-wrap"><div class="tone fade"></div><div class="focus"></div></div>
      <div class="balloon round" aria-hidden="true">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none"><ellipse vector-effect="non-scaling-stroke" cx="50" cy="50" rx="49" ry="49"/></svg>
        <span class="line"></span>
      </div>
      <span class="status visually-hidden" aria-live="polite"></span>
      <!-- 術 ("jutsu", a technique): tap when the hero's special ability is used, so there's
           nothing to remember. -->
      <button id="power" class="power" aria-pressed="false" aria-label="Special ability used">術</button>
      <div class="border"></div>
      <!-- Breaks out over the panel's top border. -->
      <div class="reading" aria-hidden="true"><div class="num"></div><div class="max"></div></div>
    </section>
    <div class="keys">
      <button class="panel key" data-side="hero" data-dir="-1" aria-label="Hero minus 1, hold for minus 5">−<span class="border"></span></button>
      <button class="panel key" data-side="hero" data-dir="1" aria-label="Hero plus 1, hold for plus 5">+<span class="border"></span></button>
    </div>
  </main>

  <!-- The HP sheet: a page of its own, laid out like the main page (villain above hero), with the
       fields as panels and the buttons as key panels. -->
  <div id="sheet" class="sheet" hidden>
    <form id="sheet-form" class="sheet-page" novalidate>
      <h1 id="sheet-title" class="sheet-title">NEW GAME!!</h1>
      <label class="panel entry" id="villain-row" data-art="spirals">
        <span class="narration" data-label="Villain HP">Villain HP</span>
        <input id="villain-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" placeholder="?">
        <span class="border"></span>
      </label>
      <label class="panel entry" id="hero-row" data-art="rays">
        <span class="narration" data-label="Hero HP">Hero HP</span>
        <input id="hero-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" placeholder="?">
        <span class="border"></span>
      </label>
      <p id="sheet-error" class="visually-hidden" role="alert"></p>
      <div class="sheet-actions">
        <button type="button" id="sheet-cancel" class="panel sheet-key">Cancel<span class="border"></span></button>
        <button type="submit" id="sheet-ok" class="panel sheet-key">FIGHT!!<span class="border"></span></button>
      </div>
    </form>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
